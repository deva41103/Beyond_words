<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Language Gloss and Pose</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap JS + Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8f9fa;
    }
    .hero {
      padding: 80px 20px;
      background: linear-gradient(135deg, #e9f2ff, #fefefe);
      text-align: center;
    }
    .hero h1 {
      font-size: 2.5rem;
      color: #333;
      font-weight: bold;
    }
    .hero p {
      color: #666;
      font-size: 1.1rem;
    }
    .btn-custom {
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 30px;
      transition: 0.3s ease;
    }
    .btn-login {
      background-color: #0d6efd;
      color: white;
    }
    .btn-login:hover {
      background-color: #084298;
    }
    .btn-signup {
      background-color: #198754;
      color: white;
    }
    .btn-signup:hover {
      background-color: #116b47;
    }
    footer {
      background-color: #343a40;
      color: white;
      padding: 15px 0;
      text-align: center;
      margin-top: 80px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#">SignLang App</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a href="{{url_for('login')}}" class="nav-link">Login</a>
          </li>
          <li class="nav-item">
            <a href="{{url_for('signup')}}" class="nav-link">Signup</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <h1>Welcome to the Sign Language Gloss and Pose Data Platform</h1>
      <p class="mt-3 mb-4">Empowering communication through AI and sign language visualization</p>
      <a href="{{url_for('login')}}" class="btn btn-login btn-custom me-3">Login</a>
      <a href="{{url_for('signup')}}" class="btn btn-signup btn-custom">Signup</a>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      &copy; 2025 SignLang App. All rights reserved.
    </div>
  </footer>

</body>
</html>
