<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generate 3D Sign Language</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      max-width: 700px;
      margin-top: 60px;
    }
    .form-section {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    .btn-block {
      width: 100%;
    }
    .navbar-brand {
      font-weight: bold;
      font-size: 1.5rem;
    }
    #spinner {
      display: none;
    }
  </style>
</head>
<body>

   <!-- Navbar -->
   <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="#">SignVerse</a>
      <div class="collapse navbar-collapse justify-content-end">
        <span class="navbar-text me-3">Welcome, {{ username }}!</span>
        <a href="/dashboard" class="btn btn-outline-light">Dashboard</a>
        <a href="/pretrained" class="btn btn-outline-light">Pretrained Videos</a>
           <a href="/logout" class="btn btn-outline-light">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Form Content -->
  <div class="container">
    <div class="form-section">
      <h2 class="mb-4 text-center">Generate 3D Sign Language</h2>

      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form id="uploadForm" action="/generate_3d_sign" method="POST" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label">Title:</label>
          <input type="text" class="form-control" name="title" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Description:</label>
          <input type="text" class="form-control" name="description">
        </div>

        <div class="mb-3">
          <label class="form-label">Upload Video (MP4, AVI, MOV, MKV):</label>
          <input type="file" class="form-control" name="video" required>
        </div>

        <div class="text-center mb-3"><strong>OR</strong></div>

        <div class="mb-4">
          <label class="form-label">YouTube Video URL:</label>
          <input type="text" class="form-control" name="youtube_url" placeholder="https://www.youtube.com/watch?v=xyz">
        </div>

        <!-- Progress bar placeholder (optional) -->
        <div class="progress mb-3" style="height: 20px; display: none;" id="uploadProgress">
          <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%">Uploading...</div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-success btn-block">Upload & Generate</button>

        <!-- Spinner -->
        <div class="text-center mt-3" id="spinner">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2">Processing video, please wait...</p>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', function () {
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('uploadProgress').style.display = 'block';
    });
  </script>

</body>
</html>
