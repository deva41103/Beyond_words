<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pretrained Sign Language Viewer</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
    }
    .navbar {
      margin-bottom: 30px;
    }
    .card {
      background-color: #1e1e1e;
      border: 1px solid #333;
    }
    .card-title {
      color: #00d1ff;
    }
    .preview-link {
      color: #00ffcc;
      text-decoration: none;
      font-weight: 500;
    }
    .preview-link:hover {
      text-decoration: underline;
    }
    video {
      border: 2px solid #00ffcc;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="#">SignVerse</a>
      <div class="collapse navbar-collapse justify-content-end">
        <span class="navbar-text me-3">Welcome, {{ username }}!</span>
        <a href="/dashboard" class="btn btn-outline-light">Dashboard</a>
           <a href="/logout" class="btn btn-outline-light">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <h2 class="mb-4 text-center">Pretrained Sign Language Demonstration</h2>

    <div class="row g-4">
      {% for video in videos %}
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 p-3">
          <h5 class="card-title">{{ video.title }}</h5>
          <p class="card-text">{{ video.description }}</p>

          <video id="video_{{ loop.index }}" class="w-100 mb-3" controls>
            <source src="{{ video.video_url }}" type="video/mp4">
            Your browser does not support the video tag.
          </video>

          <a href="{{ url_for('skeleton_preview', video_id=video.id) }}" class="preview-link">→ View 3D Sign Animation</a>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>

</body>
</html>
