<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - SignVerse</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background-color: #f8f9fa;
    }
    .dashboard-card {
      max-width: 600px;
      margin: 100px auto;
      padding: 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    .navbar-brand {
      font-weight: bold;
      font-size: 1.5rem;
    }
    .btn-action {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

   <!-- Navbar -->
   <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="#">SignVerse</a>
      <div class="collapse navbar-collapse justify-content-end">
        <span class="navbar-text me-3">Welcome, {{ username }}!</span>
           <a href="/logout" class="btn btn-outline-light">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Dashboard Content -->
  <div class="dashboard-card">
    <h2 class="mb-3">Welcome, {{ username }}!</h2>
    <p class="mb-4">You are now logged into your dashboard.</p>

    <a href="/pretrained" class="btn btn-primary btn-action">3D Sign Language Video Lectures</a>
    <a href="/generate_3d_sign" class="btn btn-success btn-action">Generate 3D Sign Language Video</a>
    <a href="/logout" class="btn btn-danger btn-action">Logout</a>
  </div>

</body>
</html>
